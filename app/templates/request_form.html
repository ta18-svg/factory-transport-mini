{% extends "base.html" %}

{% block content %}

<h1 class="h4 mb-4">搬送依頼登録</h1>

<form method="post" action="/requests/new" class="card p-4 shadow-sm">

    <div class="mb-3">
        <label class="form-label">部品名</label>
        <input type="text" name="part_name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">数量</label>
        <input type="number" name="quantity" class="form-control" min="1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">出発場所</label>
        <select name="from_location_id" class="form-select" required>
            {% for location in locations %}
            <option value="{{ location.id }}">
                {{ location.name }}（{{ location.area_type }}）
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">届け先</label>
        <select name="to_location_id" class="form-select" required>
            {% for location in locations %}
            <option value="{{ location.id }}">
                {{ location.name }}（{{ location.area_type }}）
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">優先度</label>
        <select name="priority" class="form-select" required>
            <option value="HIGH">HIGH</option>
            <option value="NORMAL" selected>NORMAL</option>
            <option value="LOW">LOW</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">担当者</label>
        <select name="assigned_user_id" class="form-select">
            <option value="">未割当</option>
            {% for worker in workers %}
            <option value="{{ worker.id }}">
                {{ worker.username }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">メモ</label>
        <textarea name="memo" class="form-control" rows="3"></textarea>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            登録
        </button>

        <a href="/requests" class="btn btn-secondary">
            一覧へ戻る
        </a>
    </div>

</form>

{% endblock %}
