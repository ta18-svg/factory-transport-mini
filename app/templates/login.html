<!doctype html>
<!-- HTML5文書であることを宣言 -->

<html lang="ja">
<!-- このページの言語が日本語であることを指定 -->

<head>
    <!-- 文字コードをUTF-8に指定 -->
    <!-- 日本語の文字化けを防ぐために必要 -->
    <meta charset="UTF-8">
    <!-- ブラウザのタブに表示されるタイトル -->
    <title>ログイン | Factory Transport Mini</title>
    <!-- Bootstrap CSSをCDNから読み込み -->
    <!-- class="container" や btn, card などのデザインが使えるようになる -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<!-- bg-light は Bootstrap の背景色クラス -->
<!-- ページ全体を薄いグレー背景にする -->
<body class="bg-light">
<!-- container は中央寄せ・余白調整用 -->
<!-- mt-5 は上方向の余白 -->
<!-- max-width: 480px でログインフォームの横幅を制限 -->
<div class="container mt-5" style="max-width: 480px;">
    <!-- card は Bootstrap のカードUI -->
    <!-- shadow-sm は薄い影を付ける -->
    <div class="card shadow-sm">
        <!-- card-body はカード内側の余白を作る -->
        <div class="card-body">
            <!-- h1タグだが、Bootstrapの h4 クラスで小さめ表示 -->
            <!-- text-center で中央寄せ -->
            <h1 class="h4 mb-3 text-center">
                Factory Transport Mini
            </h1>
            <!-- システム説明文 -->
            <!-- text-muted は薄いグレー文字 -->
            <p class="text-muted text-center">
                工場内搬送依頼管理システム
            </p>
            <!-- 
                FastAPI / Jinja2 の条件分岐

                error という変数が存在する場合だけ、
                エラーメッセージを表示する。

                例：
                「ユーザー名またはパスワードが違います」
            -->
            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}
            <!-- 
                ログインフォーム

                method="post"
                → 入力された username / password をPOST送信する

                action="/login"
                → /login というURLに送信する
            -->
            <form method="post" action="/login">
                <!-- ユーザー名入力欄 -->
                <div class="mb-3">
                    <label class="form-label">ユーザー名</label>
                    <!-- 
                        name="username" が重要

                        FastAPI側ではこの名前で受け取る。
                        例：
                        username: str = Form(...)
                    -->
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >
                </div>
                <!-- パスワード入力欄 -->
                <div class="mb-3">
                    <label class="form-label">パスワード</label>
                    <!-- 
                        type="password" にすると、
                        入力文字が ●●● のように隠れる
                    -->
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >
                </div>
                <!-- ログインボタン -->
                <!-- btn-primary は青色ボタン -->
                <!-- w-100 は横幅100% -->
                <button type="submit" class="btn btn-primary w-100">
                    ログイン
                </button>
            </form>
            <!-- 区切り線 -->
            <hr>
            <!-- テスト用ログイン情報の表示 -->
            <!-- small で小さめ文字、text-muted で薄い文字 -->
            <div class="small text-muted">
                <p class="mb-1">管理者：admin / admin123</p>
                <p class="mb-0">作業者：worker1 / worker123</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
