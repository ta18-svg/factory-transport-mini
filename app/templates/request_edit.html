{% extends "base.html" %}

{% block content %}

<h1 class="h4 mb-4">搬送依頼編集</h1>

<div class="card shadow-sm">
    <div class="card-body">

        <div class="mb-3">
            <label class="form-label">部品名</label>
            <input type="text" class="form-control" value="{{ transport_request.part_name }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">数量</label>
            <input type="text" class="form-control" value="{{ transport_request.quantity }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">出発場所</label>
            <input type="text" class="form-control" value="{{ transport_request.from_location.name }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">届け先</label>
            <input type="text" class="form-control" value="{{ transport_request.to_location.name }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">優先度</label>
            <input type="text" class="form-control" value="{{ transport_request.priority }}" readonly>
        </div>

        <form method="post" action="/requests/{{ transport_request.id }}/edit">

            <div class="mb-3">
                <label class="form-label">ステータス</label>
                <select name="status" class="form-select">
                    <option value="REQUESTED" {% if transport_request.status == "REQUESTED" %}selected{% endif %}>
                        REQUESTED
                    </option>
                    <option value="IN_PROGRESS" {% if transport_request.status == "IN_PROGRESS" %}selected{% endif %}>
                        IN_PROGRESS
                    </option>
                    <option value="DONE" {% if transport_request.status == "DONE" %}selected{% endif %}>
                        DONE
                    </option>
                </select>
            </div>

            {% if current_user.role == "admin" %}
            <div class="mb-3">
                <label class="form-label">担当者</label>
                <select name="assigned_user_id" class="form-select">
                    <option value="">未割当</option>

                    {% for worker in workers %}
                    <option
                        value="{{ worker.id }}"
                        {% if transport_request.assigned_user_id == worker.id %}selected{% endif %}
                    >
                        {{ worker.username }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            {% else %}
                <input
                    type="hidden"
                    name="assigned_user_id"
                    value="{{ transport_request.assigned_user_id or '' }}"
                >
            {% endif %}

            <div class="mb-3">
                <label class="form-label">メモ</label>
                <textarea name="memo" class="form-control" rows="3">{{ transport_request.memo or "" }}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    更新
                </button>

                <a href="/requests" class="btn btn-secondary">
                    一覧へ戻る
                </a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
